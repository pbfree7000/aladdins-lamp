</style></head><body>
<button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="menu">☰ Explore</button><nav class="menu" id="menu" aria-label="Explore Aladdin's Lamp" hidden></nav>
<main><section class="hero" id="hero" aria-label="Illustrated Aladdin's Lamp page"></section><nav id="categoryNav" class="category-nav" aria-label="Explore all treasure categories"></nav><section id="catalog" class="catalog" hidden></section><section id="searchResults" class="search-results" hidden></section><section id="journal" class="journal" hidden></section>

<script>
const pages=[
{key:'home',name:'Home',title:'Welcome to Aladdin’s Lamp',desc:'Everyday flea market magic from Ravenna, Nebraska.',desktop:'assets/Aladdin’s Lamp Hidden Treasures Homepage.png',mobile:'assets/Aladdin’s Lamp Hidden Treasures Poster.png'},
{key:'silver',name:'Silver Vault',title:'The Silver Vault',desc:'Silver, coins and remarkable vintage pieces.',desktop:'assets/silver-vault.jpg',mobile:'assets/silver-vault-mobile.jpg'},
{key:'hunt',name:'Treasure Hunt',title:'The Treasure Hunt',desc:'Unexpected discoveries and curious collectibles.',desktop:'assets/treasure-hunt.jpg',mobile:'assets/treasure-hunt-mobile.jpg'},
{key:'fresh',name:'Fresh Finds',title:'Fresh Finds',desc:'Good stuff. Good prices. Always something new.',desktop:'assets/fresh-finds.jpg',mobile:'fresh-finds-mobile.jpg'},
{key:'apothecary',name:'Rachael’s Apothecary',title:'Rachael’s Apothecary',desc:'Botanicals, teas and everyday rituals.',desktop:'assets/rachaels-apothecary.jpg',mobile:'assets/rachaels-apothecary-mobile.jpg'},
{key:'journal',name:'Treasure Journal',title:'The Treasure Journal',desc:'Stories from the shop and the treasures we find.',desktop:'assets/treasure-journal.jpg',mobile:'assets/treasure-journal-mobile.jpg'},
{key:'underground',name:'Autumn’s Underground',title:'Autumn’s Underground',desc:'Clothing, jewelry and the wonderfully unexpected.',desktop:'assets/autumns-underground.jpg',mobile:'assets/autumns-underground-mobile.jpg'}];
const catalog=document.getElementById('catalog'),searchResults=document.getElementById('searchResults');const hero=document.getElementById('hero'),menu=document.getElementById('menu'),toggle=document.getElementById('menuToggle'),journal=document.getElementById('journal');
function closeMenu(){menu.hidden=true;toggle.setAttribute('aria-expanded','false')}
toggle.addEventListener('click',()=>{menu.hidden=!menu.hidden;toggle.setAttribute('aria-expanded',String(!menu.hidden))});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
document.addEventListener('click',e=>{if(!menu.hidden&&!menu.contains(e.target)&&e.target!==toggle)closeMenu()});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function postUrl(slug){return location.origin+location.pathname+'#journal/'+encodeURIComponent(slug)}
function slugify(p){return p.slug||String(p.title||'story').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function shareBar(p){const url=postUrl(slugify(p));const title=p.title+' — Aladdin’s Lamp Treasure Journal';return '<div class="sharebar"><a target="_blank" rel="noopener noreferrer" href="https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url)+'">Share on Facebook</a><a target="_blank" rel="noopener noreferrer" href="https://www.pinterest.com/pin/create/button/?url='+encodeURIComponent(url)+'&description='+encodeURIComponent(title)+'">Pinterest</a><button type="button" data-share="'+esc(slugify(p))+'">Share elsewhere</button><button type="button" data-copy="'+esc(slugify(p))+'">Copy link</button></div>'}
async function loadJournal(selectedSlug){
 journal.hidden=false;
 journal.innerHTML='<h2>Stories from the Treasure Keepers</h2><p class="note">Our first stories are being prepared.</p>';
 try {
  const response=await fetch('journal/posts.json',{cache:'no-store'});
  if(!response.ok)return;
  const posts=await response.json();
  if(!Array.isArray(posts))return;
  const published=posts.filter(p=>p.status==='published').sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const chosen=selectedSlug?published.filter(p=>slugify(p)===selectedSlug):published;
  if(!chosen.length)return;
  journal.innerHTML='<h2>Stories from the Treasure Keepers</h2>'+chosen.map(p=>'<article><time>'+esc(p.date||'')+' · '+esc(p.author||'')+'</time><h3><a href="#journal/'+encodeURIComponent(slugify(p))+'">'+esc(p.title)+'</a></h3>'+String(p.body||'').split(/\n\s*\n/).map(t=>'<p>'+esc(t)+'</p>').join('')+shareBar(p)+'</article>').join('');
  journal.querySelectorAll('[data-copy]').forEach(b=>{
   b.onclick=async()=>{
    const url=postUrl(b.dataset.copy);
    try{await navigator.clipboard.writeText(url);b.textContent='Link copied!'}
    catch(e){prompt('Copy this link:',url)}
   };
  });
  journal.querySelectorAll('[data-share]').forEach(b=>{
   b.onclick=async()=>{
    const p=published.find(item=>slugify(item)===b.dataset.share);
    const url=postUrl(b.dataset.share);
    if(navigator.share){
     try{await navigator.share({title:p.title,url})}
     catch(e){if(e.name!=='AbortError')prompt('Copy this link:',url)}
    }else{prompt('Copy this link:',url)}
   };
  });
 }catch(e){console.warn('Journal unavailable',e)}
}
function render(){const route=decodeURIComponent(location.hash.slice(1))||'home';const key=route.split('/')[0];const page=pages.find(p=>p.key===key)||pages[0];closeMenu();document.getElementById('categoryNav').innerHTML=[['silver','Silver Vault'],['hunt','Treasure Hunt'],['fresh','Fresh Finds'],['apothecary','Rachael’s Apothecary'],['journal','Treasure Journal'],['underground','Autumn’s Underground']].map(([k,label])=>'<a href="#'+k+'" '+(page.key===k?'aria-current="page"':'')+'>'+label+'</a>').join('');menu.innerHTML=pages.map(p=>'<a href="#'+p.key+'" '+(p.key===page.key?'aria-current="page"':'')+'>'+esc(p.name)+'</a>').join('');const pic=document.createElement('picture'),source=document.createElement('source'),img=document.createElement('img');source.media='(max-width:680px)';source.srcset=encodeURI(page.mobile);img.src=encodeURI(page.desktop);img.alt=page.title+' — illustrated Aladdin’s Lamp artwork';img.decoding='async';img.onerror=()=>{hero.textContent='Artwork temporarily unavailable — please use Explore to navigate.'};pic.append(source,img);hero.replaceChildren(pic);const nav=document.createElement('nav');nav.className='art-nav';nav.setAttribute('aria-label','Main navigation');const links=[['home','Home'],['hunt','Shop'],['silver','Silver Vault'],['apothecary','Apothecary'],['underground','Autumn’s Underground'],['fresh','Specials'],['journal','Journal']];nav.innerHTML=links.map(([k,label])=>'<a href="#'+k+'" '+(page.key===k?'aria-current="page"':'')+'>'+label+'</a>').join('')+'<a class="brand" href="#home">Aladdin’s Lamp</a>';hero.appendChild(nav);const search=document.createElement('input');search.type='search';search.className='searchbox';search.id='siteSearch';search.placeholder='Find a Treasure…';search.setAttribute('aria-label','Search the shop');search.value=new URLSearchParams(location.search).get('q')||'';search.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();location.hash='#search/'+encodeURIComponent(search.value.trim())}});hero.appendChild(search);
if(page.key==='home'){const h=document.createElement('div');h.className='hotspots home';[['silver','Silver Vault'],['hunt','Treasure Hunt'],['fresh','Fresh Finds'],['apothecary','Rachael’s Apothecary'],['journal','Treasure Journal']].forEach(([key,name])=>{const a=document.createElement('a');a.href='#'+key;a.setAttribute('aria-label','Explore '+name);a.textContent=name;h.appendChild(a)});hero.appendChild(h)}
catalog.hidden=true;catalog.innerHTML='';searchResults.hidden=true;searchResults.innerHTML='';if(['silver','hunt','fresh','apothecary','underground'].includes(page.key)){catalog.hidden=false;catalog.innerHTML='<h2>'+esc(page.title)+'</h2><p>Discoveries are being catalogued by our family. For an item or special request, contact the Treasure Keepers.</p><div class="catalog-grid"><article class="catalog-card"><h3>Coming to the collection</h3><p>Hand-picked vintage treasures, with photographs and availability as they arrive.</p><p><a href="mailto:aladdinslampxyz@gmail.com?subject='+encodeURIComponent('Inquiry: '+page.title)+'">Ask about '+esc(page.name)+'</a></p></article></div>';}if(route.startsWith('search/')){const term=route.slice(7).trim();searchResults.hidden=false;const found=pages.filter(p=>(p.name+' '+p.title+' '+p.desc).toLowerCase().includes(term.toLowerCase()));searchResults.innerHTML='<h2>Search: '+esc(term)+'</h2>'+(found.length?'<ul>'+found.map(p=>'<li><a href="#'+p.key+'">'+esc(p.name)+'</a> — '+esc(p.desc)+'</li>').join('')+'</ul>':'<p>No listed sections match yet. Individual inventory search will become available as products are added.</p>');}document.getElementById('sectionTitle').textContent=page.title;document.getElementById('sectionDescription').textContent=page.desc;journal.hidden=true;journal.innerHTML='';if(page.key==='journal')loadJournal(route.split('/')[1]||'');document.title=page.name+' | Aladdin’s Lamp Hidden Treasures';window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
</script></body></html>
