<script>

{key:'home',name:'Home',title:'Welcome to Aladdin’s Lamp',desc:'Everyday flea market magic from Ravenna, Nebraska.',desktop:'assets/Aladdin’s Lamp Hidden Treasures Homepage.png',mobile:'assets/Aladdin’s Lamp Hidden Treasures Poster.png'},
{key:'silver',name:'Silver Vault',title:'The Silver Vault',desc:'Silver, coins and remarkable vintage pieces.',desktop:'assets/silver-vault.jpg',mobile:'assets/silver-vault-mobile.jpg'},
{key:'hunt',name:'Treasure Hunt',title:'The Treasure Hunt',desc:'Unexpected discoveries and curious collectibles.',desktop:'assets/treasure-hunt.jpg',mobile:'assets/treasure-hunt-mobile.jpg'},

function shopMatches(page,words){const text=(page.name+' '+page.title+' '+page.desc+' '+(shopTerms[page.key]||'')).toLowerCase();return words.every(w=>text.includes(w))}
const catalog=document.getElementById('catalog'),searchResults=document.getElementById('searchResults');const hero=document.getElementById('hero'),menu=document.getElementById('menu'),toggle=document.getElementById('menuToggle'),journal=document.getElementById('journal');

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function slugify(p){return p.slug||String(p.title||'story').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}

const SAMPLE_JOURNAL_PHOTOS={"rachael-tea":"https://images.unsplash.com/photo-1675000958107-e38b7e47244a?auto=format&fit=crop&w=1000&q=80","mike-spoon":"https://images.unsplash.com/photo-1677750267308-41213a3c52ce?auto=format&fit=crop&w=1000&q=80"};
function renderJournalBody(raw){
 const body=String(raw||''),prefix='ALADDIN_BLOCKS_V1:';
 if(!body.startsWith(prefix))return body.split(/\n\s*\n/).map(t=>'<p>'+esc(t)+'</p>').join('');
 try{
  const blocks=JSON.parse(body.slice(prefix.length));
  if(!Array.isArray(blocks)||blocks.length>300)return '<p>Story unavailable.</p>';
  return blocks.map(block=>{
   if(!block||typeof block!=='object')return '';
   if(block.kind==='text'){
    const type=block.style==='heading'?'h4':block.style==='quote'?'blockquote':block.style==='list'?'li':'p';
    return '<'+type+'>'+esc(String(block.text||''))+'</'+type+'>'
   }
   if(block.kind==='sample-photo'&&Object.prototype.hasOwnProperty.call(SAMPLE_JOURNAL_PHOTOS,String(block.id||''))){
    const size=['small','medium','full'].includes(block.size)?block.size:'medium',align=['left','center','right'].includes(block.align)?block.align:'center',caption=String(block.caption||'').slice(0,300);
    return '<figure class="journal-body-photo size-'+size+' align-'+align+'"><img loading="lazy" decoding="async" src="'+esc(SAMPLE_JOURNAL_PHOTOS[block.id])+'" alt="'+esc(caption||'Editorial demonstration photograph')+'">'+(caption?'<figcaption>'+esc(caption)+'</figcaption>':'')+'</figure>';
   }
   if(block.kind==='image'&&typeof block.id==='string'&&/^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$/.test(block.id)){
    const size=['small','medium','full'].includes(block.size)?block.size:'medium',align=['left','center','right'].includes(block.align)?block.align:'center';
    const caption=String(block.caption||'').slice(0,300);
    return '<figure class="journal-body-photo size-'+size+' align-'+align+'"><img loading="lazy" decoding="async" src="https://journal-feed.aladdinslamp.xyz/media/'+block.id+'" alt="'+esc(caption||'Journal photograph')+'">'+(caption?'<figcaption>'+esc(caption)+'</figcaption>':'')+'</figure>'
   }
   return ''
  }).join('')
 }catch{return '<p>Story unavailable.</p>'}
}
async function fetchJournalPosts(){
 const [legacy,live]=await Promise.all([
  fetch('journal/posts.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[]),
  fetch('https://journal-feed.aladdinslamp.xyz/api/articles',{cache:'no-store',signal:AbortSignal.timeout(2500)}).then(r=>r.ok?r.json():{posts:[]}).catch(()=>({posts:[]}))
 ]);
 const older=Array.isArray(legacy)?legacy:[],newer=Array.isArray(live.posts)?live.posts:[];
 const liveSlugs=new Set(newer.map(p=>slugify(p)));
 return [...newer,...older.filter(p=>!liveSlugs.has(slugify(p)))];
}

const JOURNAL_ROOMS={
 rachael:{key:'rachael',symbol:'✥',eyebrow:'Rachael’s Apothecary',title:'The Apothecary Notebook',description:'Botanicals, thoughtful rituals, old-fashioned remedies and everyday objects worth cherishing.',route:'#journal/collection/rachael'},
 mike:{key:'mike',symbol:'✦',eyebrow:'Fresh Finds & the Trade',title:'Mike’s Finds & Field Notes',description:'Antiques, curiosities, silver, collecting and whatever interesting thing the trade turns up next.',route:'#journal/collection/mike'},
 silver:{key:'silver',symbol:'◇',eyebrow:'The Silver Vault',title:'Notes from the Silver Vault',description:'Hallmarks, silver, collecting knowledge and stories from the cabinet.',route:'#journal/collection/silver'}
};
function belongsToJournalRoom(post,room){
 if(post.sample===true&&post.sampleFor===room)return true;
 const author=String(post.author||'').toLowerCase(),cat=String(post.category||'').toLowerCase();
 if(room==='rachael')return author==='rachael'||cat.includes('rachael')||cat.includes('apothecary');
 if(room==='mike')return author==='mike'||(author==='the treasure keepers'&&['behind the counter','collecting guides','treasure hunt'].includes(cat));
 if(room==='silver')return cat.includes('silver');
 return true
}

function journalCard(post){
 const url='#journal/'+encodeURIComponent(slugify(post)),safe=/^https:\/\//i.test(post.cover||'');

}

let journalLoadId=0;
async function loadJournal(journalRoute=''){
 const token=++journalLoadId;
 journal.hidden=false;

 if(parts[0]==='collection'&&!room){
  journal.innerHTML='<a class="journal-return" href="#journal">← The Treasure Journal</a><div class="journal-empty">This collection could not be found.</div>';return
 }
 const intro=room?'<a class="journal-return" href="#journal">← All journal stories</a><span class="journal-kicker">'+esc(room.eyebrow)+'</span><h2 class="journal-heading">'+esc(room.title)+'</h2><p class="journal-lede">'+esc(room.description)+'</p>':
 '<span class="journal-kicker">ALADDIN’S LAMP · STORIES & DISCOVERIES</span><h2 class="journal-heading">The Treasure Journal</h2><p class="journal-lede">Collected thoughts, extraordinary finds and the curious little histories that live inside an old shop.</p><div class="journal-rooms">'+Object.values(JOURNAL_ROOMS).map(journalRoomCard).join('')+'</div>';
 const shown=room?posts.filter(p=>belongsToJournalRoom(p,room.key)):posts;
