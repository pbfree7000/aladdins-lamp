<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a2d"><title>Aladdin's Lamp | Hidden Treasures</title><meta name="description" content="Aladdin's Lamp Hidden Treasures — vintage finds, silver, botanicals and original streetwear in Ravenna, Nebraska. Coming soon."><style>*{box-sizing:border-box}body{margin:0;background:#d8d0c2;color:#26342e;font-family:Georgia,serif}header{background:#0e292c;color:#f6d99b;padding:15px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:clamp(21px,3vw,36px);font-style:italic;text-shadow:2px 2px #8b3022}button{cursor:pointer}nav{display:flex;gap:8px;overflow-x:auto;background:#173a3c;padding:10px 5%}nav button{flex-shrink:0;border:1px solid #bd9152;border-radius:30px;background:transparent;color:#f7dba6;padding:9px 13px}nav button.active{background:#e4b15d;color:#172a2b}main{max-width:1250px;margin:auto;padding:20px}.hero{border:5px solid #a7753b;background:linear-gradient(145deg,#143f43,#70452b);border-radius:15px;overflow:hidden;position:relative}.hero img{display:block;width:100%;height:auto}.fallback{padding:8vw 20px;text-align:center;color:#ffe3ac}.fallback h1{font-size:clamp(40px,7vw,90px);margin:8px 0;text-shadow:4px 4px #7a2e22}.fallback p{font-size:20px}.eyebrow{letter-spacing:3px;text-transform:uppercase;font:700 12px system-ui}.intro{text-align:center;padding:18px}.intro h2{font-size:32px;margin:14px 0}.intro p{font:16px/1.6 system-ui;max-width:720px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.tile{padding:24px;border:2px solid #a77e4b;border-radius:10px;background:#efe5d5;text-align:center;color:#26342e;min-height:135px}.tile strong{display:block;font-size:24px;margin-bottom:8px}.tile span{font:13px system-ui}.cta{display:inline-block;margin:14px auto;background:#7b3027;color:#fff3d5;border-radius:28px;padding:13px 22px;text-decoration:none;font:700 14px system-ui}footer{background:#102a2d;color:#e8d7b4;text-align:center;padding:25px;font:13px/1.8 system-ui}footer a{color:#ffe1a2}.mobileNav{display:none}@media(max-width:680px){header{padding:12px}header strong{font-size:23px}.grid{grid-template-columns:1fr 1fr}.tile{padding:18px;min-height:115px}.tile strong{font-size:19px}.fallback{padding:60px 14px}.intro h2{font-size:26px}nav{padding:9px}main{padding:9px}}@media(max-width:400px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong>✦ Aladdin's Lamp ✦</strong><span class="eyebrow">Hidden Treasures</span></header><nav id="nav" aria-label="Main navigation"></nav><main><section id="hero" class="hero"></section><section class="intro"><h2 id="sectionTitle"></h2><p id="description"></p><a class="cta" href="mailto:aladdinslampxyz@gmail.com?subject=Aladdin%27s%20Lamp%20Inquiry">Contact the Treasure Keepers</a></section><section class="grid" id="categories"></section></main><footer>Aladdin's Lamp · Ravenna, Nebraska · Coming Soon<br><a href="mailto:aladdinslampxyz@gmail.com">aladdinslampxyz@gmail.com</a><br>© 2026 Aladdin's Lamp Hidden Treasures</footer><script>const pages=[['home','Home','Welcome to Aladdin’s Lamp','Hidden Treasures from Ravenna, Nebraska.','home'],['fresh','Fresh Finds','Fresh Finds','Good stuff. Good prices. Always something new.','fresh-finds'],['hunt','Treasure Hunt','Treasure Hunt','Unexpected discoveries and curious collectibles.','treasure-hunt'],['journal','Treasure Journal','Treasure Journal','Stories from the shop and the treasures we find.','treasure-journal'],['silver','Silver Vault','Silver Vault','Silver, coins and remarkable vintage pieces.','silver-vault'],['apothecary',"Rachael’s Apothecary","Rachael’s Apothecary",'Botanicals, teas and everyday rituals.','rachaels-apothecary'],['underground',"Autumn’s Underground","Autumn’s Underground",'Clothing, jewelry and the wonderfully unexpected.','autumns-underground']];const nav=document.getElementById('nav'),hero=document.getElementById('hero'),grid=document.getElementById('categories');function render(){const key=decodeURIComponent(location.hash.slice(1))||'home',p=pages.find(x=>x[0]===key)||pages[0];nav.innerHTML=pages.map(x=>'<button data-key="'+x[0]+'" class="'+(p[0]===x[0]?'active':'')+'">'+x[1]+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>location.hash=b.dataset.key);document.getElementById('sectionTitle').textContent=p[2];document.getElementById('description').textContent=p[3];hero.innerHTML='';const img=document.createElement('img');img.alt=p[2]+' approved illustrated landing page';img.src='assets/'+p[4]+'.jpg';img.onerror=()=>{hero.innerHTML='<div class="fallback"><div class="eyebrow">Ravenna · Nebraska</div><h1>'+p[2]+'</h1><p>'+p[3]+'</p></div>'};if(p[0]==='home'){const pic=document.createElement('picture');const source=document.createElement('source');source.media='(max-width:680px)';source.srcset='assets/home-mobile.jpg';pic.appendChild(source);pic.appendChild(img);hero.appendChild(pic)}else{hero.appendChild(img)}grid.innerHTML=pages.filter(x=>x[0]!==p[0]).map(x=>'<button class="tile" data-key="'+x[0]+'"><strong>'+x[1]+'</strong><span>Explore →</span></button>').join('');grid.querySelectorAll('button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.key;scrollTo({top:0,behavior:'smooth'})})}addEventListener('hashchange',render);render();</script></body></html>
