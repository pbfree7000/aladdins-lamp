<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treasure Journal — Writing Desk</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#151d1d;color:#f4e6c9;font:16px/1.5 system-ui,sans-serif}header{background:#101716;border-bottom:1px solid #9d7845;padding:18px 4vw;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font:700 24px Georgia,serif;color:#f5d69c}main{max-width:1100px;margin:auto;padding:24px 18px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:25px}aside,.paper{background:#202a28;border:1px solid #66513a;border-radius:14px;padding:22px}aside h2{font-size:15px;color:#d4b98b}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #9d7845;border-radius:9px;padding:9px 13px;background:#423325;color:#fff0d2}button:hover,button:focus-visible{outline:2px solid #d9b16e}button.primary{background:#8b572b}button.ghost{background:transparent}button:disabled{opacity:.5;cursor:not-allowed}input,textarea,select{background:#121a19;border:1px solid #766449;border-radius:8px;color:#fff4dc;padding:11px;width:100%}input.title{font:700 clamp(27px,4vw,42px) Georgia,serif;border:0;background:transparent;padding:5px 0}textarea{min-height:360px;resize:vertical;line-height:1.7}label{display:block;margin:14px 0 6px;color:#d5bd94;font-size:14px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.toolbar button{font-size:14px}.muted{color:#b7ad9a;font-size:13px}.story{display:block;text-align:left;width:100%;margin:7px 0;background:#1a2422}.story.active{border-color:#f0ca86;background:#4a3724}.preview{background:#f4e9d3;color:#35291e;border-radius:12px;padding:32px;min-height:360px;overflow-wrap:anywhere}.preview h1{font:700 38px Georgia,serif;margin:0}.preview h2{font:700 24px Georgia,serif}.preview p{white-space:pre-wrap}.preview img{max-width:100%;border-radius:8px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.row.space{justify-content:space-between}.hidden{display:none!important}.notice{border-left:3px solid #d7ad67;padding:9px 12px;background:#2c3028;margin:14px 0}a{color:#eac58d}@media(max-width:740px){main{grid-template-columns:1fr}header{flex-wrap:wrap}aside{order:2}.paper{order:1}}
</style></head><body><header><strong>✦ The Treasure Journal <span class="muted">Writing Desk</span></strong><a href="../index.html#journal">View public journal</a></header>
<main><aside><h2>YOUR NOTEBOOK</h2><label for="author">Writing as</label><select id="author"><option>Rachael</option><option>Mike</option></select><div class="toolbar"><button id="new">+ New story</button></div><div id="stories"></div><p class="muted">Drafts are saved to the secure account automatically after connection. Backups remain available.</p><button id="importBtn" class="ghost">Import draft or backup</button><button id="backupBtn" class="ghost" style="margin-top:8px">Back up all stories</button><input id="importFile" type="file" accept="application/json" class="hidden"></aside>
<section class="paper"><div class="row space"><span id="status" class="muted">Private draft</span><div class="row"><button id="writeBtn">Write</button><button id="previewBtn">Preview</button><button id="exportBtn">Export draft</button><button id="publishBtn" class="primary">Prepare for publishing</button></div></div>
<div id="write"><label for="title">Story title</label><input id="title" class="title" placeholder="Give your story a title…"><div class="row"><div style="flex:1;min-width:180px"><label for="category">Category</label><select id="category"><option>Behind the Counter</option><option>The Silver Vault</option><option>Rachael’s Apothecary</option><option>Treasure Hunt</option><option>Collecting Guides</option></select></div><div style="flex:1;min-width:180px"><label for="cover">Cover image URL (optional)</label><input id="cover" placeholder="https://…"></div></div><label for="excerpt">Short introduction</label><textarea id="excerpt" style="min-height:85px" placeholder="One or two sentences to introduce the story…"></textarea><label for="body">Your story</label><div class="toolbar"><button data-insert="heading">Heading</button><button data-insert="quote">Quote</button><button data-insert="bullet">List</button><button data-insert="link">Link</button></div><textarea id="body" placeholder="Start writing. Tell the story in your own words…"></textarea></div>
<div id="preview" class="hidden preview" aria-live="polite"></div><div class="notice"><strong id="connectionState">Local-only writing desk.</strong> <span id="connectionHelp">No shared account connected. Drafts remain on this device. Export a backup regularly.</span></div><div class="row"><button id="connectBtn">Connect secure account</button><button id="syncBtn" disabled>Save now</button><button id="cloudPublishBtn" disabled>Publish online</button><button id="facebookShareBtn" class="hidden" type="button">Share on Facebook</button><button id="shareStoryBtn" class="hidden" type="button">Share story</button></div><div class="row space"><span id="saved" class="muted">Ready</span><button id="deleteBtn" class="ghost">Delete this draft</button></div></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const prefix='aladdin-journal-drafts-v1';let drafts=[],active=null,timer;const fields=['title','category','cover','excerpt','body'];const escape=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);function read(){try{const v=JSON.parse(localStorage.getItem(cloudUser?.email?prefix+':'+cloudUser.email:prefix)||'[]');return Array.isArray(v)?v:[]}catch{return []}}function persist(){try{localStorage.setItem(cloudUser?.email?prefix+':'+cloudUser.email:prefix,JSON.stringify(cloudUser&&cloudUser.role!=='owner'?drafts.filter(x=>x.author===cloudUser.author):drafts));$('saved').textContent='Saved on this device · '+new Date().toLocaleTimeString()}catch{$('saved').textContent='Storage unavailable — export your draft now'}}function current(){return drafts.find(x=>x.id===active)}function list(){const author=$('author').value;$('stories').replaceChildren();drafts.filter(x=>x.author===author).sort((a,b)=>String(b.updated).localeCompare(String(a.updated))).forEach(d=>{const b=document.createElement('button');b.className='story'+(d.id===active?' active':'');b.textContent=d.title||'Untitled story';b.onclick=()=>{const old=current();save();if(cloudUser&&old)syncDraft(old,true);open(d.id)};$('stories').append(b)})}function open(key){active=key;const d=current();if(!d)return;const canShare=d.status==='published'&&!!d.slug;$('facebookShareBtn').classList.toggle('hidden',!canShare);$('shareStoryBtn').classList.toggle('hidden',!canShare);fields.forEach(k=>{$(k).value=d[k]||'';$(k).disabled=d.status==='published'});document.querySelectorAll('[data-insert]').forEach(b=>b.disabled=d.status==='published');$('status').textContent=d.status==='published'?d.author+' · Published':d.author+' · Private draft';$('write').classList.remove('hidden');$('preview').classList.add('hidden');list()}function create(){if(cloudUser?.role==='owner')return alert('Owner can review and publish existing author drafts. New stories are created by Mike or Rachael.');const old=current();save();if(cloudUser&&old)syncDraft(old,true);const d={id:id(),author:$('author').value,title:'',category:'Behind the Counter',cover:'',excerpt:'',body:'',updated:new Date().toISOString(),status:'draft'};drafts.push(d);active=d.id;persist();open(d.id);$('title').focus()}function save(){clearTimeout(timer);const d=current();if(!d||d.status==='published')return;fields.forEach(k=>d[k]=$(k).value);d.updated=new Date().toISOString();persist();list()}function schedule(){clearTimeout(timer);timer=setTimeout(()=>{const d=current();save();if(cloudUser&&d&&d.status!=='published')syncDraft(d,true)},850)}function exportDraft(){save();const d=current();if(!d)return;const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(d.title||'untitled-story').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function preparePublish(){save();const d=current();if(!d)return;const missing=[];if(!d.title.trim())missing.push('a title');if(!d.excerpt.trim())missing.push('a short introduction');if(!d.body.trim())missing.push('story text');if(missing.length){alert('Before preparing this story, please add '+missing.join(', ')+'.');return}preview();if(!confirm('Is this story ready to send for publication? This creates a file for review; it will NOT appear on the public website yet.'))return;const slug=d.title.toLowerCase().normalize('NFKD').replace(/[^a-zA-Z0-9\s-]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80)||'story';const article={slug,title:d.title.trim(),date:new Date().toISOString().slice(0,10),author:d.author,category:d.category,status:'draft',excerpt:d.excerpt.trim(),body:d.body.trim()};if(d.cover&&d.cover.startsWith('https://'))article.cover=d.cover;const blob=new Blob([JSON.stringify(article,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=slug+'-for-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent=d.author+' · Prepared for review (not published)'}function backupAll(){save();const own=cloudUser&&cloudUser.role!=='owner'?drafts.filter(x=>x.author===cloudUser.author):drafts;const blob=new Blob([JSON.stringify({format:'aladdin-journal-backup-v1',exportedAt:new Date().toISOString(),drafts:own},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='treasure-journal-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function preview(){save();const d=current();if(!d)return;const out=$('preview');out.replaceChildren();const h=document.createElement('h1');h.textContent=d.title||'Untitled story';out.append(h);const by=document.createElement('p');by.textContent='By '+d.author+' · '+d.category;out.append(by);if(d.cover&&/^https:\/\//i.test(d.cover)){const im=document.createElement('img');im.src=d.cover;im.alt='Story cover';out.append(im)}if(d.excerpt){const p=document.createElement('p');p.textContent=d.excerpt;out.append(p)}d.body.split(/\n\s*\n/).forEach(t=>{if(!t.trim())return;const el=document.createElement(t.startsWith('## ')?'h2':'p');el.textContent=t.startsWith('## ')?t.slice(3):t;out.append(el)});$('write').classList.add('hidden');out.classList.remove('hidden')}function insert(kind){const el=$('body'),start=el.selectionStart,end=el.selectionEnd,selection=el.value.slice(start,end);const snippets={heading:'\n\n## '+(selection||'Section heading')+'\n\n',quote:'\n\n“'+(selection||'A memorable quote')+'”\n\n',bullet:'\n\n• '+(selection||'First item')+'\n• Second item\n\n',link:(selection||'Link text')+' (https://example.com)'};el.setRangeText(snippets[kind],start,end,'end');el.focus();schedule()}$('author').onchange=()=>{save();const first=drafts.find(x=>x.author===$('author').value);if(first)open(first.id);else if(!cloudUser||cloudUser.role!=='owner')create();else{active=null;list()}};fields.forEach(k=>$(k).addEventListener('input',schedule));$('new').onclick=create;$('writeBtn').onclick=()=>{$('preview').classList.add('hidden');$('write').classList.remove('hidden')};$('previewBtn').onclick=preview;$('exportBtn').onclick=exportDraft;$('publishBtn').onclick=preparePublish;$('backupBtn').onclick=backupAll;window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});$('deleteBtn').onclick=async()=>{const d=current();if(!d)return;if(d.status==='published')return alert('Published stories cannot be deleted here');if(!confirm('Permanently delete this draft?'))return;if(cloudUser?.role==='owner')return alert('Owner oversight cannot delete author stories.');if(cloudUser&&d.cloudId){try{await requestApi('/api/articles/'+d.cloudId,'DELETE')}catch(e){return alert('Could not delete secure draft: '+e.message)}}drafts=drafts.filter(x=>x.id!==active);active=null;persist();const first=drafts.find(x=>x.author===$('author').value);if(first)open(first.id);else create()};document.querySelectorAll('[data-insert]').forEach(b=>b.onclick=()=>insert(b.dataset.insert));$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d&&d.format==='aladdin-journal-backup-v1'&&Array.isArray(d.drafts)){const imported=d.drafts.filter(x=>x&&typeof x.title==='string'&&typeof x.body==='string').map(x=>({...x,id:id(),updated:new Date().toISOString(),status:'draft',author:cloudUser?cloudUser.author:['Mike','Rachael'].includes(x.author)?x.author:$('author').value}));if(!imported.length)throw Error('Empty backup');save();drafts.push(...imported);persist();$('author').value=imported[0].author;open(imported[0].id);e.target.value='';return}if(!d||typeof d.title!=='string'||typeof d.body!=='string')throw Error('Invalid story');save();const copy={id:id(),author:cloudUser?cloudUser.author:['Mike','Rachael'].includes(d.author)?d.author:$('author').value,title:d.title,body:d.body,category:String(d.category||'Behind the Counter'),cover:String(d.cover||''),excerpt:String(d.excerpt||''),status:'draft',updated:new Date().toISOString()};drafts.push(copy);$('author').value=copy.author;active=copy.id;persist();open(active)}catch{alert('This file is not a valid Treasure Journal draft.')}e.target.value=''};let apiUrl='',cloudUser=null,cloudBusy=false;const inflight=new Map(),resync=new Set();async function requestApi(route,method='GET',data){if(!apiUrl)throw Error('Secure backend URL is not configured');const response=await fetch(apiUrl+route,{method,credentials:'include',headers:data?{'content-type':'application/json'}:{},body:data?JSON.stringify(data):undefined,cache:'no-store'});const body=await response.json().catch(()=>({}));if(!response.ok)throw Error(body.error||'Request failed ('+response.status+')');return body}function connection(connected,message){$('connectionState').textContent=connected?'Secure account connected.':'Local-only writing desk.';$('connectionHelp').textContent=message;$('syncBtn').disabled=!connected;$('cloudPublishBtn').disabled=!connected}async function connect(){if(cloudBusy)return;cloudBusy=true;$('connectBtn').disabled=true;try{const config=await fetch('./config.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);if(!config||typeof config.apiUrl!=='string'||!/^https:\/\//.test(config.apiUrl))throw Error('The secure backend has not been configured or deployed');apiUrl=config.apiUrl.replace(/\/$/,'');const me=await requestApi('/api/me');if(!['Mike','Rachael','Owner'].includes(me.author))throw Error('Unrecognized author account');cloudUser=me;$('author').value=me.role==='owner'?'Mike':me.author;$('author').disabled=me.role!=='owner';$('new').disabled=me.role==='owner';const result=await requestApi('/api/articles');const remote=Array.isArray(result.articles)?result.articles:[];
 save();const previous=drafts.filter(d=>me.role==='owner'||d.author===me.author),saved=read().filter(d=>me.role==='owner'||d.author===me.author);
 const allLocal=[...saved,...previous.filter(d=>!saved.some(x=>x.id===d.id))];
 const localDrafts=allLocal.filter(d=>d.status!=='published'&&!d.cloudId);
 const recovered=allLocal.filter(d=>d.cloudId&&d.status!=='published').filter(d=>{const server=remote.find(r=>r.id===d.cloudId);return !server||fields.some(k=>String(server[k]||'')!==String(d[k]||''))}).map(d=>({...d,id:id(),cloudId:undefined,updated_at:undefined,title:(d.title||'Untitled story')+' (recovered copy)'}));
 const remoteDrafts=remote.map(d=>({...d,cloudId:d.id,id:'cloud-'+d.id}));
 drafts=[...remoteDrafts,...localDrafts,...recovered];active=null;persist();if(me.role==='owner'){const first=remoteDrafts.find(x=>x.author==='Mike')||remoteDrafts[0];if(first){$('author').value=first.author;open(first.id)}else{active=null;list();$('status').textContent='No author stories yet'}}else if(remoteDrafts.length)open(remoteDrafts[0].id);else if(localDrafts.length)open(localDrafts[0].id);else create();connection(true,me.role==='owner'?'Owner oversight: review both authors’ stories, edit drafts and publish approved articles.':'Signed in as '+me.author+'. Your stories save automatically to your secure account as you write.');$('connectBtn').textContent='Refresh secure stories'}catch(e){cloudUser=null;connection(false,e.message+'. Your local drafts are unchanged. Please sign in to the protected journal URL, then reconnect.')}finally{cloudBusy=false;$('connectBtn').disabled=false}}async function syncDraft(d,quiet=false){
 if(!cloudUser||!d||(cloudUser.role!=='owner'&&d.author!==cloudUser.author)||d.status==='published')return null;
 if(inflight.has(d.id)){resync.add(d.id);return inflight.get(d.id)}
 const task=(async()=>{do{
  resync.delete(d.id);
  const payload={title:d.title,category:d.category,excerpt:d.excerpt,body:d.body,cover:d.cover};
  if(d.cloudId){
   payload.expectedUpdatedAt=d.updated_at;
   const saved=await requestApi('/api/articles/'+d.cloudId,'PUT',payload);
   d.updated_at=saved.updated_at;
  }else{
   const created=await requestApi('/api/articles','POST',payload);
   d.cloudId=created.id;d.updated_at=created.updated_at;
  }
  persist();
 }while(resync.has(d.id));
 $('saved').textContent='Saved securely · '+new Date().toLocaleTimeString();
 return d.cloudId
 })();
 inflight.set(d.id,task);
 try{return await task}catch(e){$('saved').textContent='Secure save failed — export a backup';if(!quiet)alert('Secure save failed: '+e.message);return null}finally{inflight.delete(d.id)}
}
async function sync(){save();return syncDraft(current(),false)}
function publishedLink(){const d=current();return d?.status==='published'&&d.slug?'https://aladdinslamp.xyz/#journal/'+encodeURIComponent(d.slug):null}async function shareStory(){const url=publishedLink();if(!url)return alert('Publish a story before sharing it.');const d=current();if(navigator.share){try{await navigator.share({title:d.title,url});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(url);alert('Story link copied! Paste it into your social app.')}catch{prompt('Copy this story link:',url)}}function facebookShare(){const url=publishedLink();if(!url)return alert('Publish a story before sharing it.');window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url),'_blank','noopener,noreferrer')}async function cloudPublish(){if(!cloudUser)return;const d=current();if(!d)return;if(!d.title.trim()||!d.excerpt.trim()||!d.body.trim())return alert('Add a title, short introduction and story before publishing');preview();if(!confirm('Publish this story publicly on Aladdin’s Lamp? Anyone can read it after the site deploys.'))return;const id=await sync();if(!id)return;$('cloudPublishBtn').disabled=true;try{const result=await requestApi('/api/articles/'+id+'/publish','POST',{expectedUpdatedAt:d.updated_at});d.status='published';d.slug=result.slug;persist();$('status').textContent='Published · '+result.slug;open(d.id);alert('Published to the public journal feed. The website will show the story once the journal feed is connected.')}catch(e){alert('Publishing failed: '+e.message)}finally{$('cloudPublishBtn').disabled=false}}$('connectBtn').onclick=connect;$('syncBtn').onclick=sync;$('cloudPublishBtn').onclick=cloudPublish;$('facebookShareBtn').onclick=facebookShare;$('shareStoryBtn').onclick=shareStory;if(location.pathname==='/desk'){drafts=[];$('author').disabled=true;fields.forEach(k=>$(k).disabled=true);$('status').textContent='Connecting securely…';connect()}else{drafts=read();const first=drafts.find(x=>x.author===$('author').value);if(first)open(first.id);else create()}})();
</script></body></html>
