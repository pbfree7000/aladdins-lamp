name: Journal editor security and integration tests
on:
  push:
    paths:
      - 'writing-desk/**'
      - 'backend/**'
      - 'index.html'
      - 'scripts/verify-journal-browser.cjs'
      - '.github/workflows/journal-editor-check.yml'
  pull_request:
    paths:
      - 'writing-desk/**'
      - 'backend/**'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run journal backend tests
        run: |
          cd backend
          npm test
      - name: Check inline editor script
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('writing-desk/index.html','utf8');
          const matches=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if(matches.length!==1)throw Error('Expected exactly one editor script');
          fs.writeFileSync('/tmp/aladdin-editor.cjs',matches[0][1]);
          NODE
          node --check /tmp/aladdin-editor.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test public journal and author writing flow
        run: node scripts/verify-journal-browser.cjs
