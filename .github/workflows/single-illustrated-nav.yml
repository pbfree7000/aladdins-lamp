name: Illustrated navigation — no double header QA
on:
  push:
    branches: [fix/single-illustrated-navigation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test one functional navigation over seven painted pages
        run: node scripts/verify-single-illustrated-nav.cjs
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-navigation-screenshots-${{ github.run_id }}
          path: artifacts/single-nav
          if-no-files-found: warn
          retention-days: 30
