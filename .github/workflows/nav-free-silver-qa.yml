name: Nav-free Silver Vault art and UI QA
on:
  push:
    branches: [fix/nav-free-silver-asset]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify real header and clean Silver source
        run: node scripts/verify-nav-free-silver.cjs
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav-free-silver-qa-${{ github.run_id }}
          path: artifacts/nav-free-silver/
          if-no-files-found: warn
          retention-days: 30
