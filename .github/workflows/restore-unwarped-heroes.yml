name: Restore undistorted navigation-free hero images
on:
  push:
    branches: ['fix/restore-unwarped-heroes']
    paths:
      - scripts/restore_unwarped_heroes.py
      - .github/workflows/restore-unwarped-heroes.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing packages
        run: python -m pip install "opencv-python-headless>=4.9,<5" "numpy>=1.26,<3" "Pillow>=10,<12"
      - name: Retouch navigation pixels only, audit unchanged artwork
        run: python scripts/restore_unwarped_heroes.py
      - name: Keep visual and fidelity audit
        uses: actions/upload-artifact@v4
        with:
          name: five-unwarped-original-artwork
          path: artifacts/unwarped-review/
          retention-days: 30
      - name: Commit corrected images to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*-navfree-fixed.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Restore five hero illustrations without geometric distortion"
            git push origin HEAD:fix/restore-unwarped-heroes
          fi
